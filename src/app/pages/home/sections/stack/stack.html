<section id="stack" class="mx-auto max-w-5xl px-4 sm:px-6 py-16 border-t border-outline-subtle">
  <h2 class="font-display text-2xl text-on-surface m-0">{{ 'stack.title' | transloco }}</h2>

  <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-8">
    @for (group of groups(); track group.category) {
      <div>
        <h3 class="text-sm font-medium uppercase tracking-wide text-on-surface-muted m-0">
          {{ 'stack.categories.' + group.category | transloco }}
        </h3>
        <ul class="mt-3 flex flex-wrap gap-2 list-none m-0 p-0">
          @for (item of group.items; track item) {
            <li class="text-sm border border-outline-subtle rounded-full px-3 py-1 text-on-surface">
              {{ item }}
            </li>
          }
        </ul>
      </div>
    }
  </div>
</section>
