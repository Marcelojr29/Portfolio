<header class="fixed top-0 inset-x-0 z-50 border-b border-outline-subtle bg-surface/90 backdrop-blur">
  <div class="mx-auto max-w-5xl px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
    <a
      routerLink="/"
      fragment="sobre"
      (click)="closeMenu()"
      class="font-display text-lg text-on-surface no-underline"
    >
      Marcelo Junior
    </a>

    <nav class="hidden md:block" [attr.aria-label]="'nav.mainLabel' | transloco">
      <ul class="flex items-center gap-6 list-none m-0 p-0 text-sm">
        @for (item of navItems; track item.fragment) {
          <li>
            <a
              routerLink="/"
              [fragment]="item.fragment"
              class="no-underline hover:underline underline-offset-4"
              [class.text-accent]="activeFragment() === item.fragment"
              [class.text-on-surface-muted]="activeFragment() !== item.fragment"
            >
              {{ item.labelKey | transloco }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="flex items-center gap-1">
      <app-language-toggle />
      <app-theme-toggle />

      <div class="md:hidden">
        <button
          mat-icon-button
          type="button"
          [attr.aria-label]="(menuOpen() ? 'header.closeMenu' : 'header.openMenu') | transloco"
          [attr.aria-expanded]="menuOpen()"
          (click)="toggleMenu()"
        >
          <mat-icon>{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
        </button>
      </div>
    </div>
  </div>

  @if (menuOpen()) {
    <nav
      class="md:hidden border-t border-outline-subtle bg-surface"
      [attr.aria-label]="'nav.mobileLabel' | transloco"
    >
      <ul class="flex flex-col list-none m-0 p-0">
        @for (item of navItems; track item.fragment) {
          <li class="border-b border-outline-subtle last:border-b-0">
            <a
              routerLink="/"
              [fragment]="item.fragment"
              (click)="closeMenu()"
              class="block px-6 py-3 no-underline text-on-surface"
            >
              {{ item.labelKey | transloco }}
            </a>
          </li>
        }
      </ul>
    </nav>
  }
</header>
